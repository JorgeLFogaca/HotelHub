
services:
  postgres:
    image: postgres:17
    container_name: hotelhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hotelhub
      POSTGRES_PASSWORD: hotelhub_dev
      POSTGRES_DB: hotelhub
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hotelhub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management
    container_name: hotelhub-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
